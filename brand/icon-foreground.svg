<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="XAXI">
  <!--
    XAXI - X-FLOW
    Hai duong xu huong cat nhau tao thanh chu X:
      lime  #B8FF3D  gan phang roi vot len  = dong tien vao, tang truong
      do    #E34948  gan phang roi lao xuong = dong tien ra
    Mot goc gap duy nhat moi duong, dat sau, de con doc duoc o 22px.
    Khong vi, khong dong xu, khong ky hieu tien te.
  -->
  <g transform="translate(108 108) scale(0.578)">
    <g fill="none" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 120 L240 160 L412 400" stroke="#E34948"/>
    <path d="M100 392 L240 352 L412 112" stroke="#B8FF3D"/>
    </g>
  </g>
</svg>
