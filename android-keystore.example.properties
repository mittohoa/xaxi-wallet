# Mẫu cho android/keystore.properties — CHÉP tệp này sang android/keystore.properties
# rồi điền giá trị thật. Tệp thật đã bị gitignore và KHÔNG BAO GIỜ được commit.
#
# Tạo khoá ký (chạy một lần, tự đặt mật khẩu của bạn):
#
#   keytool -genkeypair -v \
#     -keystore android/xaxi-release.jks \
#     -keyalg RSA -keysize 4096 -validity 10000 \
#     -alias xaxi
#
# MẤT TỆP .jks HOẶC MẬT KHẨU LÀ KHÔNG BAO GIỜ CẬP NHẬT ĐƯỢC APP NỮA
# (nếu đã đưa lên Play Store). Sao lưu cả hai ra chỗ an toàn ngoài máy này.

storeFile=xaxi-release.jks
storePassword=
keyAlias=xaxi
keyPassword=
